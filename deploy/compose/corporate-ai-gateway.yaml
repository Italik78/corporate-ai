services:
  corporate-ai-gateway:
    build:
      context: ../../services/corporate-ai-gateway
    container_name: corporate-ai-gateway-0.3.1
    restart: unless-stopped
    environment:
      KNOWLEDGE_ENGINE_URL: "http://corporate-ai-knowledge-engine-0.3.1-test:8090"
      QWEN_BASE_URL: "http://corporate-ai-qwen36:8000/v1"
      QWEN_MODEL: "qwen36"
      MODEL_NAME: "corporate-ai"
      TIMEOUT_SECONDS: "120"
      RAG_TOP_K: "5"
      RAG_SCORE_THRESHOLD: "0.45"
    ports:
      - "127.0.0.1:8096:8080"
    networks:
      - ai-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

networks:
  ai-net:
    external: true
